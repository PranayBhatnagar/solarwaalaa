<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Stylized illustration of rooftop solar panels under a morning sky</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A4FB3"/>
      <stop offset="55%" stop-color="#0D8BFF"/>
      <stop offset="100%" stop-color="#7fc6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a7a"/>
      <stop offset="100%" stop-color="#0b1736"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8F43A"/>
      <stop offset="100%" stop-color="#4CAF16"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f5fa"/>
      <stop offset="100%" stop-color="#dfe7f0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1280" cy="220" r="110" fill="url(#sun)" opacity="0.9"/>

  <!-- distant hills -->
  <path d="M0 700 Q 400 620 800 690 T 1600 660 V1000 H0 Z" fill="#e8eef5" opacity="0.5"/>

  <!-- house silhouette -->
  <path d="M120 760 L800 480 L1480 760 V960 H120 Z" fill="#f6f9fc"/>
  <path d="M120 760 L800 480 L1480 760 L1300 760 L800 560 L300 760 Z" fill="url(#roof)"/>

  <!-- panel array on roof -->
  <g>
    <rect x="360" y="600" width="180" height="110" rx="6" fill="url(#panel)"/>
    <rect x="556" y="600" width="180" height="110" rx="6" fill="url(#panel)"/>
    <rect x="752" y="600" width="180" height="110" rx="6" fill="url(#panel)"/>
    <rect x="948" y="600" width="180" height="110" rx="6" fill="url(#panel)"/>
    <g stroke="#2a4f8f" stroke-width="2" opacity="0.6">
      <line x1="360" y1="637" x2="1128" y2="637"/>
      <line x1="360" y1="674" x2="1128" y2="674"/>
      <line x1="450" y1="600" x2="450" y2="710"/>
      <line x1="646" y1="600" x2="646" y2="710"/>
      <line x1="842" y1="600" x2="842" y2="710"/>
      <line x1="1038" y1="600" x2="1038" y2="710"/>
    </g>
  </g>

  <rect width="1600" height="1000" fill="url(#sky)" opacity="0.06"/>
</svg>
